{% extends "base.html" %}{% set active_page = "teachers" %}{% block title %}Lehrkraft bearbeiten{% endblock %}{% block content %}<div class="card form-page"><div class="card-header"><div><span class="eyebrow">Lehrkraft #{{ teacher[0] }}</span><h1 class="card-title">✏️ Lehrkraft bearbeiten</h1><p class="page-subtitle">Kontaktdaten, Fachgebiet und Status aktualisieren.</p></div><a class="btn btn-secondary" href="{{ url_for('teacher_detail_page', teacher_id=teacher[0]) }}">← Abbrechen</a></div><form method="POST" class="management-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div class="form-group"><label>Vollständiger Name *</label><input class="form-control" name="full_name" required value="{{ teacher[1] }}"></div><div class="form-group"><label>E-Mail *</label><input class="form-control" type="email" name="email" required value="{{ teacher[2] }}"></div><div class="form-group"><label>Telefon</label><input class="form-control" name="phone" value="{{ teacher[3] or '' }}"></div><div class="form-group"><label>Fachgebiet</label><input class="form-control" name="specialization" value="{{ teacher[4] or '' }}"></div><div class="form-group"><label>Status</label><select class="form-control" name="status"><option value="active" {% if teacher[5]=='active' %}selected{% endif %}>Aktiv</option><option value="inactive" {% if teacher[5]=='inactive' %}selected{% endif %}>Inaktiv</option></select></div></div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('teacher_detail_page', teacher_id=teacher[0]) }}">Abbrechen</a><button class="btn" type="submit">Änderungen speichern</button></div></form></div>{% endblock %}
