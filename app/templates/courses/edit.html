{% extends "base.html" %}{% set active_page = "courses" %}{% block title %}Kurs bearbeiten{% endblock %}{% block content %}<div class="card form-page"><div class="card-header"><div><span class="eyebrow">Kurs #{{ course[0] }}</span><h1 class="card-title">✏️ Kurs bearbeiten</h1><p class="page-subtitle">Stammdaten, Gebühr und Status aktualisieren.</p></div><a class="btn btn-secondary" href="{{ url_for('course_detail_page', course_id=course[0]) }}">← Abbrechen</a></div><form method="POST" class="management-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><div class="form-group span-2"><label>Kursbezeichnung *</label><input class="form-control" name="title" required value="{{ course[1] }}"></div><div class="form-group"><label>Kategorie</label><input class="form-control" name="category" value="{{ course[3] or '' }}"></div><div class="form-group"><label>Standardgebühr (€)</label><input class="form-control" type="number" min="0" step="0.01" name="default_fee" value="{{ course[4] }}"></div><div class="form-group"><label>Status</label><select class="form-control" name="status"><option value="active" {% if course[5]=='active' %}selected{% endif %}>Aktiv</option><option value="inactive" {% if course[5]=='inactive' %}selected{% endif %}>Inaktiv</option><option value="archived" {% if course[5]=='archived' %}selected{% endif %}>Archiviert</option></select></div><div class="form-group span-2"><label>Beschreibung</label><textarea class="form-control" name="description" rows="5">{{ course[2] or '' }}</textarea></div></div><div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('course_detail_page', course_id=course[0]) }}">Abbrechen</a><button class="btn" type="submit">Änderungen speichern</button></div></form></div>{% endblock %}
